name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  macos-metal:
    name: macOS (Apple Silicon, Metal + MetalFX)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Dump MetalFX headers (API ground truth)
        run: |
          SDK=$(xcrun --show-sdk-path)
          echo "SDK: $SDK"
          find "$SDK/System/Library/Frameworks/MetalFX.framework" -name "*.h" 2>/dev/null | head
          for f in $(find "$SDK/System/Library/Frameworks/MetalFX.framework" -name "*.h" 2>/dev/null); do
            echo "===== $f ====="
            cat "$f"
          done
      - name: Configure (core)
        run: cmake -B build-core -DCMAKE_BUILD_TYPE=Release -DOPENDLSS_BUILD_GPU_BACKENDS=OFF
      - name: Build + test core on Apple Silicon
        run: |
          cmake --build build-core -j 3
          python3 tools/make_demo_weights.py --out models/demo-nr
          ctest --test-dir build-core --output-on-failure
        env:
          OPENDLSS_TEST_MODEL: ${{ github.workspace }}/models/demo-nr
      - name: Configure (full)
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build Metal backend
        run: cmake --build build -j 3
      - name: Metal backend report
        run: ./build/opendlss-nr info
      - name: Core report
        run: ./build-core/opendlss-nr info

  linux-vulkan:
    name: Linux (core + CPU + Vulkan shaders)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Packages
        run: sudo apt-get update && sudo apt-get install -y cmake g++ glslang-tools
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build -j 2
      - name: Demo model
        run: python3 tools/make_demo_weights.py --out models/demo-nr
      - name: Tests
        run: ctest --test-dir build --output-on-failure
        env:
          OPENDLSS_TEST_MODEL: ${{ github.workspace }}/models/demo-nr
      - name: SPIR-V artifacts
        run: ls build/shaders_spv | head -30

  windows-d3d12:
    name: Windows (core + CPU + D3D12)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release -j 2
      - name: Demo model
        run: python tools/make_demo_weights.py --out models/demo-nr
      - name: Tests
        run: ctest --test-dir build -C Release --output-on-failure
        env:
          OPENDLSS_TEST_MODEL: ${{ github.workspace }}/models/demo-nr
      - name: Backend report
        shell: pwsh
        run: Invoke-Expression "& .\build\Release\opendlss-nr.exe info"

  linux-asan:
    name: Linux AddressSanitizer
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Packages
        run: sudo apt-get update && sudo apt-get install -y cmake g++
      - name: Configure
        run: >
          cmake -B build -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_FLAGS="-fsanitize=address -fno-omit-frame-pointer -g"
          -DOPENDLSS_BUILD_GPU_BACKENDS=OFF
      - name: Build
        run: cmake --build build -j 2
      - name: Demo model
        run: python3 tools/make_demo_weights.py --out models/demo-nr
      - name: Tests under ASan
        run: ctest --test-dir build --output-on-failure
        env:
          OPENDLSS_TEST_MODEL: ${{ github.workspace }}/models/demo-nr
          ASAN_OPTIONS: detect_leaks=1
